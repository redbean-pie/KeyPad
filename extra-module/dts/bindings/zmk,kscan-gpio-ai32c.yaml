description: AI32C capacitive touch kscan driver (3-key, 2-wire encoded)

compatible: "zmk,kscan-gpio-ai32c"

include: kscan.yaml

properties:
  out-gpios:
    type: phandle-array
    required: true
    description: |
      Two GPIOs connected to AI32C OUT1 and OUT2.
      OUT1 = index 0, OUT2 = index 1.
      AI32C OUT is push-pull; the driver forces plain GPIO inputs
      (dt flags are ignored, no pull-up needed).
      Encoding (OUT1,OUT2): 11=idle, 00=KEY1, 10=KEY2, 01=KEY3.
