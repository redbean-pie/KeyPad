# USB HID（必须！不启用则 USB 无法识别设备）
CONFIG_ZMK_USB=y

# 蓝牙 BLE（必须！不启用则蓝牙不可见）
CONFIG_ZMK_BLE=y

# 启用 EC11 旋钮
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED 已移除，替换为 AI32C 触摸滑块（不需要 CONFIG_ZMK_DISPLAY）

# WS2812 RGB 灯珠
CONFIG_ZMK_RGB_UNDERGLOW=y

# 空闲待机：2 分钟无操作自动关 RGB（触摸/按键随时恢复）
CONFIG_ZMK_IDLE_TIMEOUT=120000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# 深睡眠：无 USB 且空闲 15 分钟后彻底断电（蓝牙断开），矩阵按键/触摸滑块唤醒
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 电量上报由 CONFIG_ZMK_BLE 隐含开启，nice_nano 板载 VDDH 电池传感器，无需额外配置
